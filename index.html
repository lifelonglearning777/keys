<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161B24">
<title>KEYS | 基本文タイピング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#161B24; --table-2:#1E2632; --table-3:#28303E;
  --grid:rgba(120,150,200,.06);
  --on:#E9EEF5; --on-soft:#9AA7B8; --on-dim:#6B7789;
  --paper:#FCFCFA; --paper-2:#F3F4EF;
  --ink:#14181F; --ink-soft:#59616E; --rule:#E1E4DC;
  --blue:#596A8A; --blue-2:#7E8FAE; --blue-soft:#EEF2F7; --blue-ink:#34445F;
  --red:#FF4D3D; --red-soft:#FFE9E6;
  --gold:#99640E; --gold-2:#E5B93F; --gold-soft:#FFF6D8; --gold-ink:#5C4107;
  --ok:#1FA971; --ok-soft:#EAF7F0;
  --warn:#C3893B; --warn-soft:#FBF1E2;
  --r:14px;
  --fs:16px;
  --lh:1.6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{
  font-family:"BIZ UDPGothic","Andika",system-ui,sans-serif;
  color:var(--on); line-height:var(--lh); min-height:100vh;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    radial-gradient(1200px 600px at 80% -10%,#20293A 0,var(--table) 60%);
  background-color:var(--table);
}
body.reduce-motion *{animation:none!important;transition:none!important}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.en{font-family:"Andika","BIZ UDPGothic",sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea,input,select{font-family:inherit;font-size:1rem;color:var(--ink)}
svg{display:block}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:6px}
::selection{background:rgba(229,185,63,.38)}
.sheet ::selection,.pv-doc ::selection{background:rgba(229,185,63,.3)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;border:3px solid var(--table)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
button{cursor:pointer}
button:disabled{cursor:default}
.eyebrow{font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== header ===== */
header{position:relative;border-bottom:1px solid rgba(255,255,255,.08)}
.head-in{max-width:980px;margin:0 auto;padding:.85rem 1.15rem .6rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.6rem}
.wordmark{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.55rem;letter-spacing:.14em;color:var(--on)}
.wordmark .dot{color:var(--gold-2)}
.brand .sub{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.2em;color:var(--on-dim);text-transform:uppercase}
.status{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.key-chip{display:flex;align-items:center;gap:.45rem;padding:.34rem .7rem;border:1px solid rgba(228,161,27,.45);
  border-radius:999px;background:rgba(228,161,27,.08)}
.key-chip svg{width:14px;height:14px;color:var(--gold-2)}
.key-chip b{font-family:"Space Mono",monospace;font-size:.78rem;color:var(--gold-2)}
.key-chip span{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.12em;color:var(--on-dim);text-transform:uppercase}
.streak-chip{display:flex;align-items:center;gap:.35rem;color:var(--on-soft);font-family:"Space Mono",monospace;font-size:.78rem}
.streak-chip.live{color:var(--red)}
.streak-chip svg{width:15px;height:15px}
nav{display:flex;gap:.3rem;margin-left:.2rem;flex-wrap:wrap}
nav button{font-family:"Space Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.38rem .7rem;border-radius:8px;color:var(--on-soft)}
nav button:hover{color:var(--on);background:rgba(255,255,255,.05)}
nav button.on{color:var(--table);background:var(--on)}
.xp-strip{max-width:980px;margin:0 auto;padding:.15rem 1.15rem .7rem;display:flex;align-items:center;gap:.7rem}
.xp-bar{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:999px;width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.xp-label{font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.08em;color:var(--on-dim);white-space:nowrap}

/* ===== layout ===== */
main{max-width:980px;margin:0 auto;padding:.7rem 1.15rem 3rem}
h2.sec{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--on-soft);
  margin:.85rem 0 .45rem;display:flex;align-items:center;gap:.6rem}
h2.sec::before{content:"";width:22px;height:1px;background:var(--on-dim)}
h2.sec.ja{font-family:"BIZ UDPGothic",sans-serif;font-size:.92rem;font-weight:700;letter-spacing:.3em;text-transform:none;color:var(--on)}

/* coach note */
.coach{display:flex;gap:.6rem;align-items:center;margin:.3rem 0 .9rem;border-left:2px solid var(--gold);padding:.15rem 0 .15rem .8rem}
.coach .avatar{width:34px;height:34px;flex:none;border-radius:9px;background:var(--table-2);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:var(--gold-2)}
.coach .avatar svg{width:19px;height:19px}
.coach .c-label{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--on-dim)}
.coach .c-msg{color:var(--on);font-size:.94rem;font-weight:500;margin-top:.05rem}
.today-cta{width:100%;display:flex;align-items:center;gap:.85rem;background:linear-gradient(120deg,var(--gold-2),var(--gold));
  color:#fff;border:0;border-radius:16px;padding:1rem 1.2rem;margin:.7rem 0 1rem;text-align:left;
  box-shadow:0 6px 18px -6px rgba(153,100,14,.55);transition:transform .12s,box-shadow .12s}
.today-cta:hover{transform:translateY(-1px);box-shadow:0 8px 22px -6px rgba(153,100,14,.7)}
.today-cta .tc-ic{width:30px;height:30px;flex:none}.today-cta .tc-ic svg{width:100%;height:100%}
.today-cta .tc-t{display:flex;flex-direction:column;gap:.15rem;min-width:0}.today-cta .tc-t b{color:#fff;font-size:1.08rem}
.today-cta .tc-t small{color:#fff;font-size:.78rem;opacity:.9}.today-cta .tc-arw{margin-left:auto;color:#fff;font-size:1.3rem;flex:none}

/* 押せる「?」と説明ポップアップ */
.info-pop{position:absolute;top:.65rem;right:.75rem;z-index:8}
.info-pop.inline{position:relative;top:0;right:0;flex:none;display:inline-flex;margin-left:.35rem}
.info-pop summary{list-style:none;width:22px;height:22px;padding:0;border-radius:50%;border:1.5px solid var(--gold-2);
  color:var(--gold);font-family:"BIZ UDPGothic",system-ui,sans-serif;font-size:.75rem;font-weight:700;line-height:1;
  display:grid;place-items:center;cursor:pointer;background:var(--paper)}
.info-pop summary::-webkit-details-marker{display:none}.info-pop summary::marker{content:""}
.info-pop summary:hover{border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(229,185,63,.16)}
.info-pop summary span{display:grid;place-items:center;width:100%;height:100%;line-height:1}
.info-pop[open] summary{border-color:var(--gold);color:var(--gold-ink)}
.info-pop-panel{position:absolute;top:26px;right:0;width:15rem;background:var(--ink);color:var(--on);
  border-radius:10px;padding:.7rem .8rem;font-size:.72rem;line-height:1.55;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
  text-transform:none;letter-spacing:normal}
.info-pop-panel p{margin:0 0 .45rem}.info-pop-panel p:last-child{margin-bottom:0}.info-pop-panel b{display:block;color:var(--gold-2)}
.info-pop-panel small{color:var(--on-dim)}

/* ===== paper sheet ===== */
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.04),0 18px 40px -22px rgba(0,0,0,.7);
  border:1px solid #E7E8E1;overflow:hidden}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),var(--gold-2))}
.sheet.gold::before{background:linear-gradient(var(--gold),var(--gold-2))}
.sheet-label{position:absolute;top:.7rem;right:.9rem;font-family:"Space Mono",monospace;
  font-size:.62rem;letter-spacing:.14em;color:#A9AEA2;text-transform:uppercase}
.pad{padding:1rem 1.3rem 1.05rem}

/* mission list */
.mission-row{display:flex;align-items:center;gap:.6rem;padding:.26rem 0;border-top:1px dashed var(--rule)}
.mission-row:first-of-type{border-top:none}
.mission-row .m-ic{width:20px;height:20px;flex:none;color:#C3C7BC}
.mission-row.done .m-ic{color:var(--ok)}
.mission-row span{font-size:.9rem;color:var(--ink)}
.mission-row.done span{color:var(--ink-soft);text-decoration:line-through}
.mission-note{font-family:"Space Mono",monospace;font-size:.64rem;color:var(--ok);margin-top:.4rem}
.mis-head{display:flex;align-items:center;justify-content:space-between}
.mis-keys{display:flex;gap:.25rem}
.tbox{border:1.5px dashed var(--gold);border-radius:12px;padding:.5rem .75rem;flex:none;
  display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:88px;background:#FFFDF6}
.tbox .t-dia{display:flex;gap:.28rem}
.tbox .t-dia i{font-style:normal;font-size:1.15rem;line-height:1;color:#E2DAC0}
.tbox .t-dia i.on{color:var(--gold)}
body:not(.reduce-motion) .tbox .t-dia i.on{animation:keypop .35s ease;display:inline-block}
.tbox .t-lab{font-family:"Space Mono",monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
.home-top{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:stretch}
.home-top .sheet{margin:0;display:flex;flex-direction:column}
.home-top .sheet .pad{display:flex;flex-direction:column;flex:1}

.home-side{display:flex;flex-direction:column;gap:.6rem;align-self:start}
.rc-head{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--on-soft);padding:.45rem .7rem .15rem;display:flex;align-items:center;position:relative}
.rc-head .info-pop{top:.3rem;right:.3rem}
.rc-head .info-pop-panel,.map-help .info-pop-panel{text-transform:none;letter-spacing:0;font-family:"BIZ UDPGothic",sans-serif}
.big-arw{margin-left:auto;color:var(--on-dim);font-size:1rem;transition:transform .15s}
.menu-big:hover .big-arw,.map-card:hover .big-arw{transform:translateX(3px);color:var(--on-soft)}
.map-card{display:flex;flex-direction:column;gap:.5rem;text-align:left;background:var(--table-2);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:.85rem 1rem;cursor:pointer;
  transition:border-color .15s,transform .12s}
.map-card:hover{border-color:rgba(229,185,63,.58);transform:translateY(-1px)}
.map-wrap{position:relative}.map-wrap .map-card{width:100%}.map-help{top:.65rem;right:.75rem}.map-help .info-pop-panel{top:26px}
.mode-map{margin-bottom:.35rem}
.mode-help-row{display:flex;justify-content:flex-end;align-items:center;min-height:22px;margin:0 .1rem .45rem}
.map-rule-help{width:16.5rem}
.map-rule-help .help-key{display:inline-block;width:13px;height:13px;margin-right:.25rem;vertical-align:-2px}
.map-rule-help .help-key svg{width:100%;height:100%}
.map-rule-help p:nth-child(n+2):nth-child(-n+5){margin-bottom:.35rem}
.mc-head{display:flex;align-items:center;gap:.6rem;width:100%}
.mc-head .mi{width:22px;height:22px;color:var(--gold-2);flex:none}
.mc-head b{font-size:1rem;color:var(--on)}
.mc-lv{display:flex;align-items:center;gap:.6rem;width:100%}
.mc-name{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--on-soft);flex:none;width:8.6rem;white-space:nowrap}
.mc-name small{display:block;font-family:"BIZ UDPGothic",sans-serif;font-size:.58rem;letter-spacing:.02em;text-transform:none;color:var(--on-dim)}
.mc-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2));min-width:0}
.mc-n{font-family:"Space Mono",monospace;font-size:.66rem;color:var(--gold-2);flex:none;min-width:3.2rem;text-align:right}
.mc-n em{font-style:normal;color:var(--on-dim)}
@media(max-width:760px){.home-top{grid-template-columns:1fr}}
.home-top+.menu-grid{margin-top:.6rem}
.section-lbl{font-family:"Space Mono",monospace;font-size:.72rem;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dim)}
.mode-head{display:flex;align-items:center;justify-content:space-between;min-height:42px;margin-top:.6rem;border-top:1px dashed rgba(255,255,255,.12)}
.mode-head .section-lbl{flex:1;margin:.65rem 0 .45rem;padding:0;border:0}
.mode-help .info-pop-panel{width:15rem}
.tbx-hero{display:flex;align-items:center;gap:1rem;flex:1;min-height:0;padding:.2rem 0}
.tbx-chest{width:clamp(150px,44%,210px);flex:none;filter:drop-shadow(0 4px 12px rgba(228,161,27,.25))}
.tbx-chest svg{width:100%;height:auto;display:block}
body:not(.reduce-motion) .tbx-hero[data-left="1"] .tbx-chest,
body:not(.reduce-motion) .tbx-hero.ready .tbx-chest{animation:rumble 2.4s ease-in-out infinite}
@keyframes rumble{0%,86%,100%{transform:none}88%{transform:translateX(-1.5px) rotate(-.8deg)}91%{transform:translateX(1.5px) rotate(.8deg)}94%{transform:translateX(-1px)}97%{transform:translateX(1px)}}
.tbx-side{display:flex;flex-direction:column;gap:.3rem;min-width:0}
@media(max-width:420px){.tbx-hero{flex-direction:column;text-align:center}.tbx-side{align-items:center}.btn-open{align-self:center}}
.tbx-cnt{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft)}
.tbx-cnt b{font-size:1.35rem;color:var(--gold-ink)}
.tbx-hint{font-size:.72rem;color:var(--ink-soft)}
.tbx-hint em{font-style:normal;color:#B08D2A;letter-spacing:.05em}
.tbx-note{font-size:.78rem;color:var(--gold-ink);font-weight:700}
.btn-open{font-family:"BIZ UDPGothic",sans-serif;font-weight:700;font-size:1rem;color:#4A3302;
  background:linear-gradient(120deg,var(--gold-2),var(--gold));border:0;border-radius:12px;padding:.6rem 1.3rem;
  box-shadow:0 4px 14px rgba(228,161,27,.45);margin-top:.2rem;align-self:flex-start}
body:not(.reduce-motion) .btn-open{animation:openpulse 1.6s ease-in-out infinite}
@keyframes openpulse{0%,100%{box-shadow:0 4px 14px rgba(228,161,27,.45)}50%{box-shadow:0 4px 24px rgba(228,161,27,.85)}}
.m-cards{display:flex;flex-direction:column;gap:.55rem;margin-top:.4rem}
.m-card{display:flex;align-items:center;gap:.7rem;text-align:left;background:#fff;border:1px solid var(--rule);
  border-radius:11px;padding:.48rem .75rem;transition:border-color .12s,transform .12s,box-shadow .12s}
.m-card:not(.done):hover{border-color:var(--gold-2);transform:translateY(-1px);box-shadow:0 3px 10px rgba(153,100,14,.14)}
.m-card .m-lock{width:17px;height:17px;color:#C9C2AC;flex:none}.m-card .m-lock svg{width:100%;height:100%;display:block}
.m-card .m-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.16rem}
.m-card b{font-size:.85rem;color:var(--ink)}
.m-card .m-prog{display:flex;align-items:center;gap:.5rem}
.m-card .m-bar{flex:1;max-width:9rem;height:4px;border-radius:2px;background:#EDEBE4;overflow:hidden}
.m-card .m-bar i{display:block;height:100%;background:var(--gold-2);border-radius:2px}
.chest-card{background:var(--table-2);color:var(--on);border:1px solid rgba(229,185,63,.24)}
.chest-card::before{background:linear-gradient(var(--gold-2),var(--gold))}
.chest-card .eyebrow{color:var(--gold-2)}
.chest-card .tbx-note{color:var(--gold-2);font-size:1rem}
.chest-card .m-card{background:var(--table-3);border-color:rgba(255,255,255,.08)}
.chest-card .m-card b{color:var(--on)}
.chest-card .m-card .m-bar{background:rgba(255,255,255,.1)}
.chest-card .m-card .m-n{color:var(--on-dim)}
.chest-card .m-card .m-go{color:var(--gold-2)}
.chest-card .m-card.done{background:rgba(229,185,63,.13);border-color:var(--gold)}
.chest-card .m-card.done .m-lock,.chest-card .m-card.done .m-go,.chest-card .m-card.done b{color:var(--gold-2)}
.chest-card .mis-done{color:var(--on)}
.chest-card.opened{align-self:start}
.chest-card.opened .reward.loot{flex:none;min-height:144px}
.m-card .m-n{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--ink-soft)}
.m-card .m-go{flex:none;font-family:"BIZ UDPGothic",sans-serif;font-size:.72rem;color:var(--gold-ink)}
.m-card.done{background:var(--gold-soft);border-color:var(--gold)}
.m-card.done .m-lock{color:var(--gold)}
.m-card.done .m-bar i{background:var(--gold)}
.m-card.done .m-go,.m-card.done b{color:var(--gold-ink)}
.mis-done{display:flex;align-items:center;gap:.55rem;font-size:.84rem;font-weight:700;color:var(--gold-ink);padding:.25rem 0 .1rem}
.mis-done .md-stamp{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--gold-ink);border:0;border-radius:999px;padding:.18rem .6rem;transform:none;flex:none;background:var(--gold-soft);
  display:inline-flex;align-items:center;gap:.35rem}
.mis-done .md-stamp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
body:not(.reduce-motion) .mis-done{animation:stampIn .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes keypop{0%{transform:scale(.4) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.mis-body{display:flex;gap:1rem;align-items:center;flex:1;min-height:0}
.mis-list{flex:1;min-width:0}
.mission-row .m-dia{font-size:.92rem;line-height:1;color:#CFC7AE;flex:none;width:18px;text-align:center}
.mission-row.done .m-dia{color:var(--gold)}
.mission-row .m-ok{width:16px;height:16px;color:var(--ok);margin-left:auto;flex:none}
.mission-row .m-ok svg{width:100%;height:100%}

@keyframes chestpop{0%{transform:scale(.75) rotate(-5deg)}60%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1)}}
.mission-note2{display:flex;align-items:center;gap:.4rem;font-family:"Space Mono",monospace;font-size:.66rem;color:var(--gold-ink);margin-top:.45rem}
.mission-note2 svg{width:13px;height:13px}
.mission-note2 b{font-size:.8rem}
.mix-chip{font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.1em;color:var(--gold-ink);
  border:1px solid var(--gold);border-radius:5px;padding:.08rem .35rem;margin-left:.45rem}
.f-review-note{font-size:.8rem;color:var(--ink-soft);margin-top:.7rem}
.fin-sheet{max-width:760px;margin-left:auto;margin-right:auto}
.fin-sheet .finish{position:relative;overflow:hidden;padding:1.6rem .8rem 1.4rem}
.fin-emblem{width:172px;margin:0 auto .2rem;filter:drop-shadow(0 4px 12px rgba(228,161,27,.3))}
.fin-emblem svg{width:100%;height:auto;display:block}
body:not(.reduce-motion) .fg-rays{transform-origin:100px 72px;animation:rays 18s linear infinite}
body:not(.reduce-motion) .fg-medal{transform-origin:100px 72px;animation:keypop .6s cubic-bezier(.34,1.56,.64,1)}
body:not(.reduce-motion) .fg-spark path{animation:twinkle 1.9s ease-in-out infinite}
body:not(.reduce-motion) .fg-spark path:nth-child(2){animation-delay:.5s}
body:not(.reduce-motion) .fg-spark path:nth-child(3){animation-delay:1s}
body:not(.reduce-motion) .fg-spark path:nth-child(4){animation-delay:1.4s}
.fin-confetti{position:absolute;inset:0;pointer-events:none}
.fin-confetti i{position:absolute;top:-14px;font-style:normal;opacity:0}
.fin-confetti i::before{content:"◆";font-size:.7rem;color:var(--gold)}
.fin-confetti i:nth-child(3n)::before{color:var(--blue);font-size:.55rem}

.aid-box.hints{display:flex;flex-direction:column;gap:0;padding:.15rem .8rem}
.hint-row{display:flex;align-items:baseline;gap:.6rem;padding:.34rem 0;font-size:.92rem}
.hint-row+.hint-row{border-top:1px dashed rgba(153,100,14,.22)}
.hint-row .h-tag{flex:none;font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.06em;color:var(--gold-ink);
  display:inline-flex;align-items:baseline;gap:.3rem;width:4.6rem}
.hint-row .h-tag em{font-style:normal;color:var(--ink-soft);font-family:"BIZ UDPGothic",sans-serif;font-size:.68rem}
.aid-box .h{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);display:block;margin-bottom:.15rem}
.aid-box .en{font-weight:700}

/* structure blueprint */
.blueprint{margin-top:.8rem;background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;padding:.7rem .85rem}
.blueprint .h{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:.4rem}
.bp-row{display:flex;gap:.4rem;flex-wrap:wrap}
.bp-cell{border-radius:9px;padding:.3rem .6rem .35rem;border:1.5px solid var(--rule);background:#fff;text-align:center}
.bp-cell .w{font-family:"Andika",sans-serif;font-weight:700;font-size:.98rem;color:var(--ink);display:block}
.bp-cell .role{font-size:.62rem;color:var(--ink-soft);display:block;margin-top:.05rem}
body[data-colors="on"] .bp-cell.role-s{background:#FFF6D9;border-color:#EAD588}
body[data-colors="on"] .bp-cell.role-v{background:#FFE7DC;border-color:#F0A587}
body[data-colors="on"] .bp-cell.role-o{background:var(--blue-soft);border-color:#BFD0F7}
body[data-colors="on"] .bp-cell.role-x{background:#DCF3EC;border-color:#7FCDB4}
body[data-colors="hc"] .bp-cell{border-width:2.5px}
body[data-colors="hc"] .bp-cell.role-s{border-color:#8A6008}
body[data-colors="hc"] .bp-cell.role-v{border-color:#C63C00}
body[data-colors="hc"] .bp-cell.role-o{border-color:#1B3E99}
body[data-colors="hc"] .bp-cell.role-x{border-color:#00694B}
.pattern-tag{font-family:"Space Mono",monospace;font-size:.66rem;color:var(--ink-soft);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:.16rem .6rem;display:inline-block;margin-top:.5rem}

/* speech / confidence */
.speak-row{display:flex;gap:.5rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
.btn-speak-mini{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1.5px solid var(--gold);
  border-radius:50%;background:#fff;color:var(--gold);padding:5px}
.btn-speak-mini:hover{background:var(--gold-soft)}
.btn-speak-mini svg{width:100%;height:100%}
.btn-speak{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;color:var(--gold-ink);
  border:1.5px solid var(--gold);border-radius:999px;padding:.35rem .85rem;background:#fff}
.btn-speak svg{width:15px;height:15px}
.speak-note{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--ink-soft)}
.conf-row{display:flex;gap:.45rem;margin-top:.7rem;flex-wrap:wrap;align-items:center}
.conf-note{flex-basis:100%;font-size:.68rem;color:var(--ink-soft)}
.conf-btn{flex:1;min-width:110px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;
  padding:.5rem .6rem;font-size:.85rem;color:var(--ink);transition:border-color .1s}
.conf-btn:hover{border-color:var(--gold)}
.conf-btn.on{border-color:var(--gold);background:var(--gold-soft)}
.train-nav{display:flex;justify-content:space-between;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.btn-ghost{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);padding:.55rem .9rem;border-radius:10px;border:1.5px solid var(--rule);background:#fff}
.btn-ghost:hover{border-color:var(--ink-soft)}
.key-earn{position:relative;display:flex;align-items:center;gap:.7rem;background:linear-gradient(120deg,#FFF8E4,#FBF0CF);
  border:1.5px solid var(--gold);border-radius:14px;padding:.7rem 1rem;margin-top:.8rem;overflow:hidden;
  animation:stampIn .35s cubic-bezier(.3,1.4,.5,1)}
.key-earn::after{content:"";position:absolute;top:0;bottom:0;width:46px;left:-60px;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}
body:not(.reduce-motion) .key-earn::after{animation:shine 1.1s ease .15s 1}
@keyframes shine{to{left:110%}}
.ke-icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:50%;
  background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(228,161,27,.45)}
.ke-icon svg{width:21px;height:21px}
body:not(.reduce-motion) .ke-icon{animation:keypop .45s cubic-bezier(.34,1.56,.64,1)}
.ke-t b{font-size:1rem;color:var(--gold-ink);display:block}
.ke-dias{display:flex;align-items:center;gap:.3rem;margin-top:.15rem}
.ke-dias i{font-style:normal;font-size:1rem;line-height:1;color:#E0D7BC}
.ke-dias i.on{color:var(--gold)}
.ke-dias small{font-size:.72rem;color:#8A6008;margin-left:.3rem}
.key-earn.master{background:linear-gradient(120deg,var(--gold-2),var(--gold));border-color:#C98F12}
.key-earn.master .ke-icon{background:#fff;color:var(--gold)}
.key-earn.master .ke-t b{color:#4A3302;letter-spacing:.04em}
.key-earn.master .ke-dias i.on{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.key-earn.master .ke-dias small{color:#5E4104}
.ke-burst{position:absolute;left:28px;top:50%;width:0;height:0;pointer-events:none}
.ke-burst i{position:absolute;font-style:normal}
.ke-burst i::before{content:"◆";font-size:.6rem;color:var(--gold)}
.ke-burst i:nth-child(2n)::before{color:var(--blue-2)}
.ke-burst i:nth-child(3n)::before{font-size:.45rem}
body:not(.reduce-motion) .ke-burst i{animation:burst .8s ease-out .1s forwards;opacity:0}
.ke-burst i:nth-child(1){--bx:46px;--by:-30px}.ke-burst i:nth-child(2){--bx:70px;--by:-6px}
.ke-burst i:nth-child(3){--bx:52px;--by:22px}.ke-burst i:nth-child(4){--bx:14px;--by:-40px}
.ke-burst i:nth-child(5){--bx:-14px;--by:-26px}.ke-burst i:nth-child(6){--bx:-26px;--by:8px}
.ke-burst i:nth-child(7){--bx:10px;--by:34px}.ke-burst i:nth-child(8){--bx:88px;--by:-28px}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}80%{opacity:1}
  100%{transform:translate(var(--bx),var(--by)) scale(1) rotate(120deg);opacity:0}}

/* finish */
.finish{text-align:center;padding:.6rem 0 .3rem}
.finish .fstamp{display:inline-flex;align-items:center;gap:.4rem;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.14em;
  color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:.3rem 1rem;font-size:.85rem;
  animation:stampIn .35s cubic-bezier(.3,1.4,.5,1)}
.finish .fstamp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.finish .ftitle{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:1.1rem;color:var(--ink);margin-top:.7rem}
.f-detail{display:flex;justify-content:center;gap:.35rem;flex-wrap:wrap;margin:.55rem 0}
.f-detail span{font-family:"Space Mono",monospace;font-size:.66rem;color:var(--ink-soft);background:var(--paper-2);border-radius:999px;padding:.15rem .55rem}
.badge-pop{display:flex;align-items:center;gap:.75rem;background:#FFFCF3;border:1px solid rgba(228,161,27,.35);border-radius:14px;
  padding:.75rem 1rem;margin:.6rem auto 0;width:fit-content;max-width:22rem;text-align:left;box-shadow:0 3px 10px -6px rgba(180,130,10,.4);animation:stampIn .3s ease}
.badge-pop .bi{width:40px;height:40px;flex:none;padding:9px;border-radius:50%;background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(153,100,14,.28)}
.badge-pop .bi svg{width:100%;height:100%}
.badge-pop b{font-size:.9rem;color:var(--ink);display:block}
.badge-pop small{display:block;font-size:.74rem;color:var(--ink-soft);margin-top:.1rem}

/* QUICK RESPONSE */
.response-setup .pad{padding:1.15rem 1.3rem}
.response-title{font-size:1.35rem;color:var(--ink);margin:.15rem 0}
.response-lead{font-size:.94rem;color:var(--ink-soft);max-width:46rem;line-height:1.8}
.response-block{margin-top:1rem}
.response-label{display:block;font-size:.76rem;font-weight:700;letter-spacing:.08em;color:var(--gold-ink);margin-bottom:.45rem}
.response-modes,.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.response-mode,.route-grid button{min-width:0;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:.72rem .8rem;color:var(--ink)}
.response-mode{display:flex;align-items:center;gap:.7rem;min-height:76px}
.response-mode b,.route-grid b{font-family:"Space Mono",monospace;font-size:.83rem;letter-spacing:.05em;text-transform:uppercase;display:block;word-break:keep-all}
.response-mode small,.route-grid small{font-size:.8rem;color:var(--ink-soft);display:block;margin-top:.12rem}
.response-mode:hover,.route-grid button:hover{border-color:var(--gold)}
.response-mode.on,.route-grid button.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.response-progress{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1rem}
.response-progress span{display:flex;align-items:center;gap:.7rem;background:var(--paper-2);border:1px solid var(--rule);border-radius:999px;padding:.3rem .7rem}
.response-progress b{font-family:"Space Mono",monospace;font-size:.62rem;color:var(--ink-soft)}
.response-progress em{font-family:"Space Mono",monospace;font-size:.7rem;font-style:normal;color:var(--gold-ink)}
.response-question{margin-top:.7rem}
.response-question .btn-speak{margin-top:.35rem}
.response-cue{margin-top:.8rem;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0;padding:.55rem .75rem;color:var(--ink)}
.response-good>b{display:block;font-size:1rem}
.response-alts{margin-top:.55rem;padding-top:.5rem;border-top:1px solid rgba(31,169,113,.22)}
.response-alts>span{display:block;font-size:.72rem;color:var(--ink-soft);margin-bottom:.3rem}
.response-alts>div{display:flex;gap:.35rem;flex-wrap:wrap}
.response-alts em{font-style:normal;font-weight:700;font-size:.82rem;color:var(--ink);
  background:#fff;border:1px solid rgba(31,169,113,.25);border-radius:999px;padding:.18rem .55rem}
.response-finish{padding:1.35rem 0 .5rem}
.response-medal{position:relative;width:76px;height:76px;margin:0 auto .6rem;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--gold-2),var(--gold));
  border:6px solid #FFF2C7;box-shadow:0 5px 18px rgba(153,100,14,.28)}
.response-medal svg{width:34px;height:34px}
.response-medal span{position:absolute;right:-5px;top:-7px;width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;background:#fff;color:var(--gold);font-size:.9rem;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.response-ten{display:flex;justify-content:center;gap:.25rem;flex-wrap:wrap;margin:.7rem auto 0;max-width:20rem}
.response-ten i{font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;
  background:var(--gold-soft);color:var(--gold-ink);font-family:"Space Mono",monospace;font-size:.68rem;font-weight:700}
body:not(.reduce-motion) .response-medal{animation:keypop .55s cubic-bezier(.34,1.56,.64,1)}
body:not(.reduce-motion) .response-ten i{animation:stampIn .3s ease both}
body:not(.reduce-motion) .response-ten i:nth-child(2){animation-delay:.04s}
body:not(.reduce-motion) .response-ten i:nth-child(3){animation-delay:.08s}
body:not(.reduce-motion) .response-ten i:nth-child(4){animation-delay:.12s}
body:not(.reduce-motion) .response-ten i:nth-child(5){animation-delay:.16s}
body:not(.reduce-motion) .response-ten i:nth-child(6){animation-delay:.20s}
body:not(.reduce-motion) .response-ten i:nth-child(7){animation-delay:.24s}
body:not(.reduce-motion) .response-ten i:nth-child(8){animation-delay:.28s}
body:not(.reduce-motion) .response-ten i:nth-child(9){animation-delay:.32s}
body:not(.reduce-motion) .response-ten i:nth-child(10){animation-delay:.36s}
@media(max-width:680px){.response-modes,.route-grid{grid-template-columns:1fr}}

/* CBT */

@media(max-width:680px){
 .cs-group{flex-direction:column;align-items:flex-start;gap:.4rem}

}

.mine{border-left:2px solid var(--gold)}

.data-card .info-card{margin-top:.7rem}
.data-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:.45rem;margin-top:0}

.empty{font-family:"Space Mono",monospace;font-size:.72rem;color:var(--on-dim)}
.info-card{background:var(--table-2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.9rem 1.1rem;

.info-card b{color:var(--on)}

/* settings */
.set-card{background:var(--table-2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.85rem .95rem;margin-bottom:.6rem}
.set-row{display:flex;align-items:center;gap:.7rem;padding:.42rem 0;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.set-row:first-child{border-top:none}
.set-row .lbl{flex:1;font-size:.88rem;color:var(--on)}
.set-row .lbl,.cs-lbl{word-break:keep-all;overflow-wrap:break-word}
.set-row .lbl small{display:block;font-size:.7rem;color:var(--on-dim)}
.set-row input[type=text],.set-row input[type=password]{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:.34rem .6rem;font-size:.85rem;color:var(--on);caret-color:var(--gold-2)}
.set-row input::placeholder{color:var(--on-dim)}
.set-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(229,185,63,.16);background:rgba(255,255,255,.09)}
.scoring-row{border-top:1px dashed rgba(255,255,255,.08);padding-top:.7rem}

.seg{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden}
.seg button{font-size:.76rem;padding:.32rem .7rem;color:var(--on-soft)}
.seg button.on{background:var(--on);color:var(--table)}
.toggle{width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .15s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:23px}

.pv-cols{column-count:2;column-gap:1.6rem}
.pv-item{break-inside:avoid;padding:.28rem 0;border-bottom:1px dotted #CFCFCF}

.pv-foot{margin-top:1rem;padding-top:.4rem;border-top:1px solid #D8D8D8;font-family:"Space Mono",monospace;font-size:.58rem;color:#999;text-align:center;letter-spacing:.08em}
@media print{

}

 if(a.length>2&&a.join(" ")===arr.join(" "))a.push(a.shift());
 return a}

/* ---------- 正誤判定エンジン ---------- */
const CONTR=[["I'm","I am"],["you're","you are"],["he's","he is"],["she's","she is"],["it's","it is"],
 ["we're","we are"],["they're","they are"],["that's","that is"],["there's","there is"],["what's","what is"],
 ["who's","who is"],["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],
 ["don't","do not"],["doesn't","does not"],["didn't","did not"],["can't","cannot"],["won't","will not"],
 ["haven't","have not"],["hasn't","has not"],["hadn't","had not"],["I've","I have"],["you've","you have"],
 ["we've","we have"],["they've","they have"],["I'll","I will"],["you'll","you will"],["he'll","he will"],
 ["she'll","she will"],["it'll","it will"],["we'll","we will"],["they'll","they will"],
 ["shouldn't","should not"],["wouldn't","would not"],["couldn't","could not"],["I'd","I would"]];
function normSp(s){return String(s).normalize("NFKC").replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"')
  .replace(/\u3000/g," ").replace(/\s+/g," ").trim()}
/* 短縮形は英作文・CBTだけで双方向に認める。語彙・語順の別解は各問題のaltへ明示する */
function expandVariants(ans){const set=new Set([normSp(ans)]);let grew=true;
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  while(grew&&set.size<60){grew=false;
    for(const s of [...set]){for(const[c,f]of CONTR){
      for(const[cc,ff] of [[c,f],[cap(c),cap(f)]]){
        const a=s.replace(new RegExp("\\b"+cc+"\\b","g"),ff);
        if(a!==s&&!set.has(a)){set.add(a);grew=true}
        const b=s.replace(new RegExp("\\b"+ff+"\\b","g"),cc);
        if(b!==s&&!set.has(b)){set.add(b);grew=true}
      }}}}
  return set}
function contentKey(s){return normSp(s).toLowerCase().replace(/[.?!,"]/g,"").replace(/'/g,"").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]}
const PAST_IRR={go:"went",have:"had",get:"got",come:"came",see:"saw",make:"made",take:"took",give:"gave",send:"sent",tell:"told",teach:"taught",say:"said",eat:"ate",run:"ran",swim:"swam",sing:"sang",buy:"bought",think:"thought"};
/* 戻り値: {ok, perfect, issues[], msgs[]} */
function judge(input,q,opts){
  opts=typeof opts==="boolean"?{strict:opts,flex:true}:(opts||{});
  const strict=!!opts.strict,flex=!!opts.flex;
  const inp=normSp(input);if(!inp)return{ok:false,perfect:false,issues:["empty"],msgs:["英文を入力してみよう。"]};
  let variants=new Set();(flex?q.answers:[q.en]).forEach(a=>{
    (flex?expandVariants(a):new Set([normSp(a)])).forEach(v=>variants.add(v))});
  if(variants.has(inp))return{ok:true,perfect:true,issues:[],msgs:[]};
  const ck=contentKey(inp);const okContent=[...variants].some(v=>contentKey(v)===ck);
  const issues=[],msgs=[];
  if(okContent){
    if(/^[a-z]/.test(inp))
      {issues.push("capital");msgs.push("文頭は大文字で始めよう。")}
    const lastCh=inp.slice(-1);
    if(q.punct==="?"&&lastCh!=="?"){issues.push("qmark");msgs.push("たずねる文なので、最後に「?」を付けよう。")}
    else if(q.punct==="!"&&lastCh!=="!"){issues.push("emark");msgs.push("感嘆文なので、最後に「!」を付けよう。")}
    else if(q.punct==="."&&lastCh!=="."){issues.push("period");msgs.push("文の最後にピリオドを付けよう。")}
    if(q.en.includes("'")&&!inp.includes("'")){issues.push("apos");msgs.push("アポストロフィ(')を忘れずに。")}
    if(issues.length===0){issues.push("case");msgs.push("大文字・小文字をもう一度見直そう。")}
    return{ok:!strict,perfect:false,issues,msgs};
  }
  /* 内容の誤り分析: 最も近い正解と比較 */
  let best=null,bestD=1e9;
  for(const v of variants){const d=lev(contentKey(v),ck);if(d<bestD){bestD=d;best=v}}
  const aw=contentKey(best).split(" "),iw=ck.split(" ");
  const aSet={},iSet={};aw.forEach(w=>aSet[w]=(aSet[w]||0)+1);iw.forEach(w=>iSet[w]=(iSet[w]||0)+1);
  const missing=[],extra=[];
  Object.keys(aSet).forEach(w=>{if((iSet[w]||0)<aSet[w])missing.push(w)});
  Object.keys(iSet).forEach(w=>{if((aSet[w]||0)<iSet[w])extra.push(w)});
  const sameSet=missing.length===0&&extra.length===0;
  if(sameSet&&aw.join(" ")!==iw.join(" ")){issues.push("order");msgs.push("使う単語は合っています。語順をもう一度考えてみよう。")}
  else{
    /* スペル: missing と extra のペアで距離1-2 */
    const spellPairs=[];
    missing.slice().forEach(mw=>{extra.slice().forEach(ew=>{
      if(lev(mw,ew)<=Math.max(1,Math.floor(mw.length/4))&&!spellPairs.some(p=>p[0]===mw||p[1]===ew))spellPairs.push([mw,ew])})});
    spellPairs.forEach(([mw,ew])=>{
      issues.push("spell");
      /* 文法ヒューリスティック */
      if(ew+"s"===mw||ew+"es"===mw)msgs.push(`主語に合わせて、動詞の形(${mw})を確認しよう。`);
      else if(mw+"s"===ew||mw+"es"===ew)msgs.push(`この文では「${mw}」と原形(または単数形)を使います。`);
      else if(PAST_IRR[ew]===mw)msgs.push(`過去のことなので、動詞を過去形(${mw})にしよう。`);
      else if(ew+"ed"===mw||ew+"d"===mw)msgs.push(`過去のことなので、動詞を過去形にしよう。`);
      else if(["am","is","are","was","were"].includes(mw)&&["am","is","are","was","were"].includes(ew))msgs.push(`主語に合うbe動詞は「${mw}」です。`);
      else msgs.push(`「${ew}」のスペルをもう一度確認しよう。`);
      missing.splice(missing.indexOf(mw),1);extra.splice(extra.indexOf(ew),1);});
    if(missing.length){issues.push("missing");
      if(missing.every(w=>["a","an","the"].includes(w)))msgs.push("冠詞(a / an / the)を忘れていないかな。");
      else msgs.push(`足りない単語がありそうです: ${missing.slice(0,3).join(", ")}`)}
    if(extra.length){issues.push("extra");msgs.push(`この文では使わない単語があります: ${extra.slice(0,3).join(", ")}`)}
    if(!issues.length){issues.push("other");msgs.push("もう一度、日本語の意味と語順を確かめてみよう。")}
  }
  return{ok:false,perfect:false,issues,msgs};
}

/* ---------- 間隔反復 ---------- */
function schedule(q,result){/* result: wrong | hint | self | guess | surewrong */
  const st=qs(q.id);
  if(result==="wrong"){st.wins=0;st.due=todayStr();st.st="要復習";st.wrong++}
  else if(result==="surewrong"){st.wins=0;st.due=todayStr();st.st="要復習";st.wrong++;st.pri=1}
  else if(result==="guess"){st.due=addDays(1);st.st="練習中"}
  else if(result==="hint"){st.due=addDays(1);st.st="ヒントありで正解"}
  else{st.wins++;st.st=st.wins>=3?"定着":"自力で正解";
    st.due=addDays(st.wins===1?3:st.wins===2?7:st.wins===3?14:30);st.pri=0}
  save()}
function dueList(){const t=todayStr();return Q.filter(q=>{const s=S.q[q.id];return s&&s.due&&s.due<=t})
  .sort((a,b)=>(S.q[b.id].pri||0)-(S.q[a.id].pri||0))}
function unsureList(){return Q.filter(q=>{const s=S.q[q.id];return s&&!isMaster(q.id)&&(["要復習","ヒントありで正解","練習中"].includes(s.st)||["mid","guess"].includes(s.conf))})}
function weakList(){return Q.filter(q=>(S.q[q.id]?.wrong||0)>=2).sort((a,b)=>S.q[b.id].wrong-S.q[a.id].wrong)}

function giveKey(q,k){const st=qs(q.id);if(st.keys[k])return false;st.keys[k]=1;day().keys++;save();return true}

function totalKeys(){return Object.values(S.q).reduce((n,s)=>n+(s.keys?s.keys.c+s.keys.m+s.keys.w:0),0)}
function masterCount(){return Q.filter(q=>isMaster(q.id)).length}

function sfx(kind){if(!S.set.sfx)return;try{
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==="suspended")AC.resume();
 const t=AC.currentTime;
 const tone=(f,st,d,type,vol)=>{type=type||"sine";vol=vol||.1;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t+st);
  g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(vol,t+st+.012);g.gain.exponentialRampToValueAtTime(.0008,t+st+d);
  o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+d+.03)};
 if(kind==="ok"){tone(659,0,.12);tone(880,.09,.18)}
 else if(kind==="key"){tone(523,0,.1);tone(659,.08,.1);tone(784,.16,.24,"sine",.12)}
 else if(kind==="chest"){tone(392,0,.16,"triangle",.11);tone(523,.12,.16,"triangle",.11);tone(659,.24,.16,"triangle",.12);tone(1047,.38,.4,"triangle",.13)}
 else if(kind==="ng"){tone(233,0,.14,"sine",.05)}
}catch(e){}}

function bindHome(){
 const rw=$("#btnRw");if(rw)rw.onclick=()=>speak(todayReward()[0]);
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
  if(b.dataset.act==="open-chest"){sfx("chest");claimReward();render();return}
 const a=b.dataset.act;
 if(a==="map")nav("map");
 else if(a==="records")nav("records");
 else if(a==="cbt")startCbtSetup();
 else if(a==="response")startResponseSetup();
 else if(a==="resume"&&S.resume)resumeSession();
 else if(a==="review")startSession(dueList().map(q=>q.id),"write","今日の復習",true);
 else if(a==="unsure")startSession(unsureList().slice(0,10).map(q=>q.id),"write","まだ不安",true);
 else if(a==="weak")startSession(weakList().slice(0,10).map(q=>q.id),"write","苦手集中",true);
 else if(a==="quick-copy")pickRandom("copy");
 else if(a==="quick-write")pickRandom("write");
 else if(a==="today")todayPractice();
})}
function pickRandom(mode){
 const inGrade=Q.filter(q=>!S.set.grade||q.level<=S.set.grade);
 const base=inGrade.length?inGrade:Q;
 const notMastered=base.filter(q=>!isMaster(q.id));
 const pool=notMastered.length?notMastered:base;
 startSession(shuffle(pool).slice(0,5).map(q=>q.id),mode,mode==="copy"?"タイピング5問":"英作文5問",false)}
function todayPractice(){
 const due=dueList();
 let ids=shuffle(due.map(q=>q.id)).slice(0,5);
 if(ids.length<5){
  const base=Q.filter(q=>!S.set.grade||q.level<=S.set.grade).filter(q=>!ids.includes(q.id));
  const notMastered=base.filter(q=>!isMaster(q.id));
  ids=ids.concat(shuffle(notMastered.length?notMastered:base).slice(0,5-ids.length).map(q=>q.id))}
 if(!ids.length){notice("いまは出題できる問題がありません。学習マップを確認してください。");return}
 startSession(ids,"write","今日の練習",false)}

function modeName(m){return{copy:"お手本タイピング",step:"ステップタイピング",order:"語順トレーニング",write:"英作文"}[m]||m}

/* ---------- 学習セッション ---------- */
function startSession(ids,mode,label,review){
 if(!ids.length){notice("いまはこのリストに問題がありません。マップから練習してみよう!");return}
 let list=ids.slice(),mixed={};
 if(!review&&mode==="write"){ /* 定着のため、期限がきた復習問題を自動で混ぜる(インターリーブ) */
   const extra=dueList().map(q=>q.id).filter(id=>!list.includes(id)).slice(0,2);
   extra.forEach((id,i)=>{const pos=i===0?0:Math.min(list.length,Math.ceil(list.length/2));list.splice(pos,0,id);mixed[id]=1});
 }
 session={list,idx:0,mode,label,review:!!review,att:null,requeued:{},correct:0,t0:Date.now(),mixed,startKeys:totalKeys(),startMaster:masterCount()};
 S.resume={list,idx:0,mode,label,review:!!review,mixed};save();
 view="session";render()}
function resumeSession(){const r=S.resume;if(!r)return;
 session={list:r.list.filter(id=>QBY[id]),idx:Math.min(r.idx,r.list.length-1),mode:r.mode,label:r.label,review:r.review,att:null,requeued:{},correct:0,t0:Date.now(),mixed:r.mixed||{},startKeys:totalKeys(),startMaster:masterCount()};
 if(!session.list.length){S.resume=null;save();return}
 view="session";render()}
function curQ(){return QBY[session.list[session.idx]]}
function newAtt(){const q=curQ();session.att={tries:0,hint:0,conf:"",done:false,step:1,phase:0,
 t0:0,total:0,err:0,bs:0,prevLen:0,order:[],usedIdx:[],result:"",acc:null,wpm:null,retry:(S.q[q.id]?.wrong||0)>0}}
function vSession(){
 if(!session.att)newAtt();
 const q=curQ(),a=session.att,m=session.mode;
 const stepTags=m==="step"?[1,2,3,4].map(s=>`<span class="stp ${s===a.step?'on':s<a.step?'past':''}">Step ${s}</span>`).join(""):
   session.list.map((_,i)=>`<span class="stp ${i===session.idx?'on':i<session.idx?'past':''}">${i+1}</span>`).join("");
 let body="";
 if(a.done)body=vDone(q,a);
 else if(m==="copy")body=vCopy(q,a);
 else if(m==="step")body=vStep(q,a);
 else if(m==="order")body=vOrder(q,a);
 else body=vWrite(q,a);
 return`<div class="train-top"><button class="btn-quit" id="btnQuit">← 中断する</button>
   <div class="steps">${stepTags}</div></div>
 <section class="sheet">
   <div class="train-sheet">${body}</div></section>`}
function isMixed(q){return!!(session&&session.mixed&&session.mixed[q.id])}
function metaHtml(q,justEarned){const s=S.q[q.id];
 return`<div class="q-meta"><span>${esc(levelName(q.level))} · ${esc(q.unit)}${session&&session.mode?" · "+esc(modeName(session.mode)):""}</span>${isMixed(q)?'<span class="mix-chip">復習</span>':""}
  <span class="key-progress" aria-label="この問題の鍵の進み具合">${['c','m','w'].map(k=>`<i class="${s&&s.keys[k]?'on':''}${justEarned===k?' pop':''}">${ICONS.key}</i>`).join("")}</span></div>`}

/* --- お手本タイピング --- */
function vCopy(q,a){
 const t=q.en,inp=a.cur||"",matched=(()=>{let n=0;while(n<inp.length&&n<t.length&&inp[n]===t[n])n++;return n})();
 const bad=inp.length>matched;
 const nextCh=!bad?t[matched]:"";
 return`${metaHtml(q)}
 <div class="q-en en" aria-label="お手本">${esc(t.slice(0,matched))?`<span class="hit">${esc(t.slice(0,matched))}</span>`:""}${bad?`<span class="miss">${esc(t.slice(matched,matched+1))}</span><span class="rest">${esc(t.slice(matched+1))}</span>`:`<span class="rest">${esc(t.slice(matched))}</span>`}</div>
 ${S.set.showJa?`<div class="q-ja">${esc(q.ja)}</div>`:""}
 <div class="type-line"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false"
   placeholder="お手本を見ながら、そのまま打とう" value="${esc(inp)}" aria-label="入力欄"></div>
 <div class="type-bar">
  <div class="type-stats">
   <span>ミス <b>${a.err}</b></span><span>Backspace <b>${a.bs}</b></span>
   <span>${a.t0?`経過 <b>${Math.round((Date.now()-a.t0)/1000)}</b> 秒`:"タイプすると計測開始"}</span>
  </div>
  <button class="kb-toggle" id="btnKbToggle" type="button" aria-pressed="${S.set.showKb}">${S.set.showKb?"キーボードを隠す":"キーボードを表示"}</button>
 </div>
 ${S.set.showKb?kbHtml(nextCh):""}`}
const KB_ROWS=[["1","2","3","4","5","6","7","8","9","0"],["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["shift","Z","X","C","V","B","N","M",",",".","?"]];
function kbHtml(nextCh){
 const isUpperLetter=/[A-Z]/.test(nextCh);
 const isApos=nextCh==="'";
 const needsShift=isUpperLetter||isApos;
 const lower=nextCh?nextCh.toLowerCase():"";
 const isPunct=k=>[",",".","?"].includes(k);
 const rowHtml=(row,isNumRow)=>row.map(k=>{
   let active=false,dim=isNumRow;
   if(isNumRow){if(k==="7"&&isApos){active=true;dim=false}}
   else if(k==="shift")active=needsShift;
   else if(isPunct(k))active=nextCh===k;
   else active=/[A-Za-z]/.test(k)&&lower===k.toLowerCase();
   return `<span class="kb-key${active?' active':''}${k==="shift"?' wide':''}${dim?' dim':''}">${k==="shift"?"Shift":k}</span>`}).join("");
 const spaceActive=nextCh===" ";
 return`<div class="kb-board" aria-hidden="true">
  <div class="kb-row">${rowHtml(KB_ROWS[0],true)}</div>
  <div class="kb-row">${rowHtml(KB_ROWS[1])}</div>
  <div class="kb-row kb-row2">${rowHtml(KB_ROWS[2])}</div>
  <div class="kb-row">${rowHtml(KB_ROWS[3])}</div>
  <div class="kb-row"><span class="kb-key kb-space${spaceActive?' active':''}">Space</span></div>
  ${isApos?'<div class="kb-hint">アポストロフィ（\'）は Shift + 7</div>':""}
 </div>`}
function bindCopy(q,a){const ti=$("#ti");if(!ti)return;ti.focus();
 try{ti.setSelectionRange(ti.value.length,ti.value.length)}catch(e){}
 ti.onkeydown=e=>{if(e.key==="Backspace")a.bs++};
 ti.oninput=()=>{if(!a.t0)a.t0=Date.now();
  const v=ti.value;
  if(v.length>a.prevLen){a.total++;if(!q.en.startsWith(normSp(v))&&!q.en.startsWith(v))a.err++}
  a.prevLen=v.length;a.cur=v;
  if(v===q.en){finishCopy(q,a)}else render()}
 const kt=$("#btnKbToggle");if(kt)kt.onclick=()=>{S.set.showKb=!S.set.showKb;save();render()}}
function finishCopy(q,a){
 const sec=(Date.now()-a.t0)/1000;
 a.acc=a.total?Math.max(0,Math.round((a.total-a.err)/a.total*100)):100;
 a.wpm=sec>1?Math.min(250,Math.round(q.words.length/(sec/60))):0;a.sec=Math.round(sec);
 a.done=true;a.result="copy";
 const d=day();d.sent++;d.accS+=a.acc;d.accN++;d.wpmS+=a.wpm;d.wpmN++;d.sec+=a.sec;if(a.acc>=100)d.perfect++;
 if(session.review){d.rev++}
 a.keyNew=giveKey(q,"c");sfx(a.keyNew?"key":"ok");touchStreak();
 logResult({qid:q.id,level:q.level,mode:"copy",result:"ok",input:q.en,answer:q.en,duration:a.sec,accuracy:a.acc,wpm:a.wpm,errType:"",hintLevel:0,confidence:"",});
 checkBadges({acc:a.acc,review:session.review,retry:a.retry,tries:1,ok:true});
 save();render();speak(q.en)}

/* --- ステップ --- */
function stepPrompt(q,step){
 if(step===1)return{en:q.en,ja:q.ja};
 if(step===2){const w=q.words.map((w,i)=>i%2===1?w.replace(/[A-Za-z]/g,"_"):w);return{en:w.join(" ")+q.punct,ja:q.ja}}
 if(step===3)return{en:q.firstLetter,ja:q.ja};
 return{en:"",ja:q.ja}}
function vStep(q,a){const p=stepPrompt(q,a.step);
 return`${metaHtml(q)}
 ${p.en?`<div class="q-en en">${esc(p.en)}</div>`:""}
 <div class="q-ja ${p.en?"":"big"}">${esc(q.ja)}</div>
 <div class="type-line"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${a.step===4?"日本語だけを見て、英文を打とう":"英文を打とう"}" aria-label="入力欄"></div>
 <div id="fbArea">${a.fb||""}</div>
 <div class="train-nav">
   <button class="btn-ghost" id="btnSkipQ">この文をとばす</button>
   <button class="btn-primary" id="btnCheck">${ICONS.check} 確認する</button>
 </div>`}
function bindStep(q,a){const ti=$("#ti");if(ti){ti.focus();ti.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#btnCheck").click()}}}
 $("#btnCheck").onclick=()=>{const r=judge(ti.value,q,{strict:false,flex:false});a.tries++;
  if(r.ok){
    if(a.step<4){a.fb=fbHtml(r,q,`Step ${a.step} クリア!`);a.step++;a.fb+="";render()}
    else{a.done=true;a.result="step";
      const d=day();d.sent++;d.self++;if(session.review)d.rev++;
      const k1=giveKey(q,"c"),k2=giveKey(q,"m"),k3=giveKey(q,"w");a.keyNew=k1||k2||k3;sfx(a.keyNew?"key":"ok");touchStreak();
      logResult({qid:q.id,level:q.level,mode:"step",result:"ok",input:normSp(ti.value),answer:q.en,duration:0,accuracy:"",wpm:"",errType:"",hintLevel:a.step-1,confidence:""});
      checkBadges({review:session.review,retry:a.retry,tries:a.tries,ok:true,noHint:false,hinted:true});
      save();render();speak(q.en)}}
  else{a.fb=fbHtml(r,q);render()}};
 $("#btnSkipQ").onclick=()=>{scheduleAndNext(q,a,"wrong",true)}}

/* --- 語順 --- */
function vOrder(q,a){
 if(!a.tokens)a.tokens=q.words.map(w=>({w,isPunct:false})).concat(q.punct?[{w:q.punct,isPunct:true}]:[]);
 if(!a.shuffled){a.shuffled=shuffle(a.tokens.map((t,i)=>({...t,i})));a.usedIdx=[]}
 if(a.phase===1)return vCopyPhase(q,a);
 const built=a.usedIdx.map(k=>a.shuffled[k]);
 return`${metaHtml(q)}
 <div class="q-ja big">${esc(q.ja)}</div>
 <div class="order-area">
  <div class="order-built" aria-label="作った英文">${built.length?built.map((o,bi)=>`<button class="w-chip built ${o.isPunct?'punct':''}" data-b="${bi}">${esc(o.w)}</button>`).join(""):'<span class="order-note">下のカードを順にタップ（数字キーでもOK）</span>'}</div>
  <div class="order-bank">${a.shuffled.map((o,i)=>`<button class="w-chip ${o.isPunct?'punct':''} ${a.usedIdx.includes(i)?'used':''}" data-c="${i}">${esc(o.w)}<span class="kbd">${i+1}</span></button>`).join("")}</div>
  <div class="order-note">句読点（. や ?）も1枚のカードです・Backspaceで1つ戻せます</div></div>
 <div id="fbArea">${a.fb||""}</div>
 <div class="train-nav"><button class="btn-ghost" id="btnReset">やり直す</button>
  <button class="btn-primary" id="btnCheck" ${a.usedIdx.length===a.tokens.length?"":"disabled"}>${ICONS.check} 語順を確認</button></div>`}
function vCopyPhase(q,a){
 return`${metaHtml(q)}
 <div class="fb good"><span class="h">Nice</span>語順OK! 仕上げに、この英文をタイピングしよう。</div>
 <div class="q-en en" style="margin-top:.6rem">${esc(q.en)}</div>
 <div class="type-line"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="入力欄"></div>`}
function bindOrder(q,a){
 if(a.phase===1){const ti=$("#ti");if(ti){ti.focus();ti.oninput=()=>{
   if(ti.value===q.en){
     a.done=true;a.result="order";
     const d=day();d.sent++;if(session.review)d.rev++;
     const k1=giveKey(q,"c"),k2=giveKey(q,"m");a.keyNew=k1||k2;sfx(a.keyNew?"key":"ok");touchStreak();
     logResult({qid:q.id,level:q.level,mode:"order",result:"ok",input:q.en,answer:q.en,duration:0,accuracy:"",wpm:"",errType:"",hintLevel:4,confidence:""});
     checkBadges({review:session.review,retry:a.retry,tries:a.tries||1,ok:true,hinted:true});
     save();render();speak(q.en)}}}
  return}
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
   const i=Number(b.dataset.c);if(!a.usedIdx.includes(i)){a.usedIdx.push(i);a.fb="";render()}});
 document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{a.usedIdx.splice(Number(b.dataset.b),1);render()});
 document.onkeydown=e=>{if(view!=="session"||!session||session.att!==a||a.phase===1)return;
   if(e.key==="Backspace"){a.usedIdx.pop();render();e.preventDefault()}
   const n=Number(e.key);if(n>=1&&n<=a.shuffled.length&&!a.usedIdx.includes(n-1)){a.usedIdx.push(n-1);render()}};
 $("#btnReset").onclick=()=>{a.usedIdx=[];a.fb="";render()};
 const ck=$("#btnCheck");if(ck)ck.onclick=()=>{
   const built=a.usedIdx.map(k=>a.shuffled[k]);a.tries=(a.tries||0)+1;
   const builtWords=built.filter(o=>!o.isPunct).map(o=>o.w).join(" ");
   const hasPunct=a.tokens.some(t=>t.isPunct);
   const punctOk=!hasPunct||(built.length&&built[built.length-1].isPunct&&built.filter(o=>o.isPunct).length===1);
   if(builtWords===q.words.join(" ")&&punctOk){a.phase=1;render()}
   else if(builtWords===q.words.join(" ")&&hasPunct){a.fb=`<div class="fb almost"><span class="h">Almost</span>単語の順番はOK! 句読点（${esc(q.punct)}）を最後に置こう。</div>`;render()}
   else{a.fb=`<div class="fb almost"><span class="h">Almost</span>使う単語は合っています。語順をもう一度考えてみよう。</div>`;render()}}}

/* --- 英作文 --- */
function vWrite(q,a){

 <div class="q-ja big">${esc(q.ja)}</div>

 $("#btnCheck").onclick=()=>{

    addPhrase(q);save();render();speak(q.en)}
  else{sfx("ng");a.fb=fbHtml(r,q);a.lastWrongSure=false;
    logResult({qid:q.id,level:q.level,mode:"write",result:"ng",input:a.lastInput,answer:q.en,duration:0,accuracy:"",wpm:"",errType:r.issues.join(";"),hintLevel:a.hint,confidence:""});

/* --- 正解後(設計図・音声・自信度・次へ) --- */
function vDone(q,a){
 const showConf=S.set.conf&&!a.confDone&&session.mode!=="copy";
 const earned=a.result==="write"?(a.hint===0?"w":"m"):a.result==="order"?"m":a.result==="step"?"w":"c";
 return`${metaHtml(q,a.keyNew?earned:null)}
 <div style="position:relative"><span class="stamp gold">${a.result==="copy"&&a.acc>=100?"PERFECT":"CLEAR"}</span>
 <div class="q-en en">${esc(q.en)}</div><div class="q-ja">${esc(q.ja)}</div></div>

function submitCbt(timeup){saveCbtInput();clearInterval(cbt.timer);
 cbt.res=cbt.list.map(q=>{const inp=cbt.ans[q.id]||"";const r=judge(inp,q,{strict:true,flex:true});
   if(!r.perfect&&!(r.issues.length===0))schedule(q,"wrong");else if(r.perfect)schedule(q,"self");
   logResult({qid:q.id,level:q.level,mode:"cbt",result:r.perfect?"ok":"ng",input:normSp(inp),answer:q.en,duration:0,accuracy:"",wpm:"",errType:r.issues.join(";"),hintLevel:0,confidence:""});
   return{q,inp,ok:r.perfect,msgs:r.msgs}});
 cbt.timeup=timeup;cbt.submitted=true;
 const okN=cbt.res.filter(r=>r.ok).length,rate=Math.round(okN/cbt.res.length*100);
 const d=day();d.sent+=okN;touchStreak();
 checkBadges({cbt:true,cbtRate:rate,cbtFlag:cbt.usedFlag});save();render()}

/* ---------- 記録 ---------- */
function badgeProgress(b){
 const rev=()=>Object.values(S.days).reduce((n,d)=>n+(d.rev||0),0);
 const unitP=(lv,ui)=>{const items=Q.filter(q=>q.level===lv&&q.ui===ui);return[items.filter(q=>isMaster(q.id)).length,items.length]};
 switch(b.id){
  case "firstkey":return[totalKeys(),1];
  case "threesent":return[allSent(),3];
  case "tensent":return[allSent(),10];
  case "fifty":return[allSent(),50];
  case "streak3":return[S.streak,3];
  case "streak5":return[S.streak,5];
  case "streak10":return[S.streak,10];
  case "memkeeper":return[rev(),10];
  case "beverb":return unitP(1,0);
  case "question":return unitP(1,3);
  case "past":return unitP(1,4);
  case "compare":return unitP(2,5);
  case "passive":return unitP(2,6);
  case "perfecttense":return unitP(3,0);
  case "treasure5":return[S.rewards.length,5];
  default:return null}}
const BICON={firstkey:"key",threesent:"pen",tensent:"book",fifty:"chart",acc90:"type",acc95:"type",perfect:"spark",
 comeback:"rev",memkeeper:"rev",nohint:"pen",hintuser:"coach",streak3:"flame",streak5:"flame",streak10:"flame",
 onemore:"circle",nevergiveup:"check",beverb:"map",question:"map",past:"map",compare:"map",passive:"map",perfecttense:"map",
 cbt1:"cbt",cbtready:"cbt",reviewck:"check",treasure:"key",treasure5:"book"};

 </div>

 </div>

 <div class="stat-grid">
  <div class="stat"><b>${RESPONSE_YN.reduce((n,x)=>n+(S.response[`yn:${x.id}:yes`]?1:0)+(S.response[`yn:${x.id}:no`]?1:0),0)}<em> / ${RESPONSE_YN.length*2}</em></b><span>YES / NO</span></div>

 </div>
 <h2 class="sec ja">バッジ</h2>
 ${(()=>{

   const scored=locked.map(b=>{const p=badgeProgress(b);const ratio=p&&p[1]?Math.min(.99,p[0]/p[1]):-1;return{b,p,ratio}});
   scored.sort((a,b)=>b.ratio-a.ratio);
   const nextUp=scored.slice(0,3),restLocked=scored.slice(3);

 ${S.rewards.length?(()=>{const rv=S.rewards.slice().reverse(),rs=rewardAll?rv:rv.slice(0,6);
   return`<div class="phrase-grid">`+rs.map((r,i)=>`<div class="phrase-card"><div><span class="p en">${esc(r.en)}</span><small>${esc(r.ja)} · ${esc(r.date)}</small></div>

   (rv.length>6?`<button class="show-more" data-more="reward">${rewardAll?"とじる ▲":`すべて表示 (${rv.length}件) ▼`}</button>`:"")})():
  `<p class="empty">1日のミッションを3つクリアして宝箱をあけると、ネイティブがよく使うフレーズが1つずつたまります。</p>`}

 <div class="set-card">

 <h2 class="sec">Data</h2>

  :`<div class="set-row"><span class="lbl">先生向け設定<small>パスコードを入力</small></span>
   <input type="password" id="tPass" style="width:6rem" placeholder="****" autocomplete="off">
   <button class="btn-aid" id="btnTeacher" style="background:transparent">ひらく</button></div>`}
 </div>
 <p class="empty">KEYSは外部サーバーやAIを使いません。入力内容はこの端末の中にだけ保存されます。</p>`}
function bindSettings(){
 document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{const k=b.dataset.set;let v=b.dataset.val;
  if(k==="fs"||k==="cbtN"||k==="cbtMin"||k==="grade")v=Number(v);if(k==="rate")v=Number(v);
  S.set[k]=v;save();applySettings();render()});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const k=b.dataset.tg;
  if(k==="motionOff")S.set.motion=!S.set.motion;else S.set[k]=!S.set[k];
  save();applySettings();render()});
 const nk=$("#setNick");if(nk)nk.onchange=()=>{S.set.nick=normSp(nk.value).slice(0,12);save()};
 bindDataActions();
 const qc=$("#btnQCsv");if(qc)qc.onclick=()=>{
  const head="id,level,unit,japanese,answer,alternativeAnswers,referenceExpressions,typingText,wordBlocks,sentencePattern,explanation";
  const rows=Q.map(q=>[q.id,q.level,q.unit,q.ja,q.en,q.answers.slice(1).join("|"),q.also.map(x=>x.join("：")).join("|"),q.en,q.words.join("/"),q.pat,q.exp].map(csvCell).join(","));
  dl("keys-questions.csv","\uFEFF"+[head,...rows].join("\n"),"text/csv")};
 const rh=$("#btnResetHist");if(rh)rh.onclick=()=>askConfirm("学習履歴(鍵・バッジ・記録)を初期化します。\n設定は残ります。よろしいですか?",()=>{
   const set=S.set;S=structuredClone(DEFAULTS);S.set=set;save();render();notice("学習履歴を初期化しました(設定は残っています)")},"初期化する",true);
 const bt=$("#btnTeacher");if(bt)bt.onclick=()=>{
  if($("#tPass").value===(S.set.tpass||"7777")){teacherOpen=true;render()}else notice("パスコードが違います")}
 const cp=$("#btnChgPass");if(cp)cp.onclick=()=>{
  const v=normSp($("#newPass").value);
  if(v.length<4||v.length>12){notice("パスコードは4〜12文字で設定してください");return}
  S.set.tpass=v;save();$("#newPass").value="";notice("パスコードを変更しました(この端末にのみ保存されます)")}}
function applySettings(){
 document.documentElement.style.setProperty("--fs",S.set.fs+"px");
 document.body.dataset.colors=S.set.colors;
 document.body.classList.toggle("reduce-motion",!S.set.motion)}

/* ---------- レンダリング ---------- */
function render(){
 renderHeader();
 const app=$("#app");
 if(view==="session"&&session){app.innerHTML=vSession();
   $("#btnQuit").onclick=()=>askConfirm("練習を中断しますか?\n(つづきから再開できます)",()=>nav("home"),"中断する");
   const q=curQ(),a=session.att;
   if(a.done)bindDone(q,a);
   else if(session.mode==="copy")bindCopy(q,a);
   else if(session.mode==="step")bindStep(q,a);
   else if(session.mode==="order")bindOrder(q,a);
   else bindWrite(q,a);
   return}
 if(view==="cbtSetup"){app.innerHTML=vCbtSetup();bindCbtSetup();return}
 if(view==="cbt"&&cbt){app.innerHTML=vCbt();bindCbt();return}
 if(view==="responseSetup"){app.innerHTML=vResponseSetup();bindResponseSetup();return}
 if(view==="response"&&responseSession){app.innerHTML=vResponse();bindResponse();return}
 if(view==="map"){app.innerHTML=vMap();bindMap();return}
 if(view==="records"){app.innerHTML=vRecords();bindRecords();return}
 if(view==="print"){app.innerHTML=vPrint();bindPrint();return}
 if(view==="settings"){app.innerHTML=vSettings();bindSettings();return}
 view="home";app.innerHTML=vHome();bindHome()}

/* ---------- 簡易テスト(開発用: コンソールで runTests() ) ---------- */
function runTests(){
 const q=Q.find(x=>x.en==="I can run fast.");
 const fixed={strict:false,flex:false},write={strict:false,flex:true},cbtMode={strict:true,flex:true};
 const cant=Q.find(x=>x.en==="I can't swim well.");
 const ifq=Q.find(x=>x.en.startsWith("If it's fine"));
 const thatq=Q.find(x=>x.en.startsWith("Kenta's mother told"));
 const giving=Q.find(x=>x.en==="Giving can be done by anyone.");
 const openAlt=[
  ["op-subject","English."],["op-food","Dumplings."],["op-free","I play chess in my free time."],
  ["op-musician","Aileen."],["op-birthday","June 16th."],["op-song","My Ballad."],
  ["op-restaurant","That restaurant."],["op-why","Their soup is delicious."],["op-cake","Me."],
  ["op-whose","Mine."],["op-ask","Go ahead."],["op-help","Sure."],
  ["op-photo","In Osaka."],["op-howlong","Since I was little."]
 ];
 const t=[
  [judge("I can run fast.",q,fixed).perfect,true,"完全一致"],
  [judge("i can run fast",q,fixed).ok,true,"ステップ:大文字・記号はゆるめ"],
  [judge("i can run fast",q,cbtMode).ok,false,"CBT:大文字・記号は厳格"],
  [judge("fast can run I.",q,fixed).issues.includes("order"),true,"語順違い検出"],
  [judge("I can ran fast.",q,fixed).issues.includes("spell"),true,"スペル/活用検出"],
  [judge("I can run.",q,fixed).issues.includes("missing"),true,"単語不足検出"],
  [judge("  I   can run fast. ",q,fixed).perfect,true,"連続空白・前後空白"],
  [judge("I can\u2019t swim well.",cant,fixed).perfect,true,"スマートアポストロフィ"],
  [judge("I cannot swim well.",cant,fixed).ok,false,"ステップ:短縮形は固定"],
  [judge("I cannot swim well.",cant,write).perfect,true,"英作文:短縮形⇔非短縮形"],
  [judge("My father has a bike made in France.",Q.find(x=>x.en.includes("bicycle made")),fixed).ok,false,"ステップ:語彙は基本文に固定"],
  [judge("My father has a bike made in France.",Q.find(x=>x.en.includes("bicycle made")),cbtMode).perfect,true,"CBT:登録済み別解"],
  [judge("I will play soccer if it's fine next Sunday.",ifq,cbtMode).perfect,true,"CBT:if節の位置変更"],
  [judge("I will play soccer if it's fine next Sunday.",ifq,fixed).ok,false,"ステップ:if節は基本語順に固定"],
  [judge("Kenta's mother told me Kenta was sick in bed.",thatq,cbtMode).perfect,true,"CBT:that省略"],
  [judge("Kenta's mother told me Kenta was sick in bed.",thatq,fixed).ok,false,"ステップ:that省略不可"],
  [judge("Giving can be done by anyone.",giving,cbtMode).perfect,true,"教科書表現を維持"],
  [judge("Anyone can give.",giving,cbtMode).ok,false,"参考表現は正解に含めない"],
  [judge("Are you from the USA?",Q.find(x=>x.en==="Are you from the U.S.?"),cbtMode).perfect,true,"登録済み表記違い"],
  [judge("There are a lot of balls in the box.",Q.find(x=>x.en==="There are many balls in the box."),cbtMode).perfect,true,"登録済み語彙違い"],
  [responseOk("yes i am",RESPONSE_YN[0].yes),true,"Response:大文字・記号はゆるめ"],
  [responseOk("No, I am not.",RESPONSE_YN[0].no),true,"Response:短縮形と非短縮形"],
  [responseOk("Yes, I do.",RESPONSE_YN[0].yes),false,"Response:助動詞違いを不正解"],
  [responseOk("I've been here since I was little.",RESPONSE_OPEN.find(x=>x.id==="op-howlong").a),true,"Response:現在完了の短縮形"],
  [RESPONSE_YN.filter(x=>x.grade<=1).length,11,"Village RouteのYES/NO問題数"],
  [RESPONSE_OPEN.filter(x=>x.grade<=3).length,14,"Tower RouteのOPEN問題数"],
  ...openAlt.map(([id,input])=>[responseOk(input,RESPONSE_OPEN.find(x=>x.id===id).a),true,`Response別解:${id}`])
 ];
 let ok=0;t.forEach(([got,want,name])=>{const p=got===want;if(p)ok++;console[p?"log":"error"](`${p?"✔":"✘"} ${name}`,p?"":`got=${got}`)});
 console.log(`${ok}/${t.length} passed`);return ok===t.length}

/* ---------- 起動 ---------- */
function init(){load();applySettings();
 window.addEventListener("storage",e=>{if(e.key===SKEY){load();applySettings();if(view!=="session"&&view!=="cbt")render()}});
 if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
 render()}
if(typeof document!=="undefined"&&document.getElementById("app"))init();
if(typeof globalThis!=="undefined")globalThis.runTests=runTests;
</script>
